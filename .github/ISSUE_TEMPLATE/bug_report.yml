name: Bug report
description: Report a reproducible problem with a skill, script, template, or workflow.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Career Evidence Toolkit. Do not include real resumes, certificates, contact details, private URLs, access tokens, or other personal data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - career-onboarding
        - master-resume-maintainer
        - certificate-registry-sync
        - targeted-resume-generator
        - ATS Professional Resume
        - Executive Technical Resume
        - Validation / scripts
        - Documentation / Wiki / website
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue using synthetic or redacted data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed personal career data, secrets, private URLs, and account identifiers from this report.
          required: true
