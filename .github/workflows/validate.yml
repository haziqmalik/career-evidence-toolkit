name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills, manifests, privacy and DOCX assets
        run: python3 plugins/career-evidence-toolkit/scripts/validate_repo.py .
